name: Weekly security audit

# Runs npm audit every Monday. A failed run means a package needs fixing,
# and GitHub emails the account that last edited this file.
on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (9am Eastern in summer, 8am in winter)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        run: |
          set +e
          npm audit > audit.txt 2>&1
          status=$?
          cat audit.txt
          {
            echo "## npm audit"
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
